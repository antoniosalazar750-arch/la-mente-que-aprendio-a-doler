<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<meta name="description" content="Cómo sanar lo que el cerebro guarda y el alma elige sostener. Pide tu ejemplar dedicado por Martha Lugo.">
<meta property="og:type" content="website">

<meta property="og:description" content="Pide tu ejemplar dedicado y firmado por la autora.">
<meta property="og:image" content="https://la-mente-que-aprendio-a-doler.vercel.app/og.jpg">

<meta name="twitter:card" content="summary_large_image">

<link rel="apple-touch-icon" href="icon-512.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,300;0,6..72,400;0,6..72,500;1,6..72,400&family=Inter:wght@400;500;600;700&display=swap">
<style>
:root{--g1:#22050c;--g2:#63041e;--deep:#4f0618;--acc:#b8860b;--soft:#f0d9b5;--ink:#2a0d12;--bg:#fbf6ee;--mute:#2a0d12b8;--line:#f0d9b599;--panel:#fff}
*{box-sizing:border-box;min-width:0}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.65 Inter,system-ui,sans-serif;overflow-x:clip}
h1,h2,h3{font-family:Newsreader,Georgia,serif;font-weight:400;line-height:1.1;letter-spacing:-.015em;text-wrap:balance;margin:0 0 14px}
h1{font-size:clamp(38px,9vw,60px)}h2{font-size:clamp(30px,6.4vw,42px)}h3{font-size:22px;margin-bottom:6px}
p{margin:0 0 14px}.mute{color:var(--mute)}
.wrap{max-width:720px;margin:0 auto;padding:0 22px}
.kicker{font-size:13px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--acc);margin-bottom:10px}
nav{position:sticky;top:0;z-index:5;background:color-mix(in srgb,var(--g1) 92%,transparent);backdrop-filter:blur(8px);color:#fff}
nav .wrap{display:flex;align-items:center;justify-content:space-between;gap:12px;height:58px}
nav b{font:500 17px Newsreader,Georgia,serif;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
nav a{flex:none;color:var(--g1);background:var(--soft);text-decoration:none;font:600 14px Inter,sans-serif;padding:9px 14px;border-radius:999px}
.hero{background:radial-gradient(120% 80% at 50% 0%,var(--g2),var(--g1) 75%);color:#fff;padding:42px 0 54px;text-align:center}
.hero img{width:min(62vw,260px);border-radius:6px;box-shadow:0 26px 50px rgba(0,0,0,.45);margin:0 auto 28px;display:block}
.hero .by{color:var(--soft);font-weight:500;margin-bottom:8px}
.hero p.lead{font-size:18px;color:#ffffffd9;max-width:30em;margin:0 auto 26px}
.btn{appearance:none;border:0;border-radius:14px;background:var(--deep);color:#fff;font:600 17px Inter,sans-serif;min-height:54px;padding:0 22px;cursor:pointer;width:100%;display:flex;align-items:center;justify-content:center;text-decoration:none;text-align:center;line-height:1.25}
.btn.gold{background:var(--soft);color:var(--g1)}
.btn.ghost{background:transparent;color:inherit;border:1.5px solid currentColor;opacity:.92}
.btn.small{min-height:46px;font-size:15px}
.ctas{display:grid;gap:10px;max-width:380px;margin:0 auto}
.price{margin-top:14px;font-size:14px;color:#ffffffc0}
section{padding:54px 0;border-bottom:1px solid var(--line)}
.list{list-style:none;padding:0;margin:18px 0 0;display:grid;gap:10px}
.list li{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px 16px 14px 46px;position:relative}
.list li:before{content:"";position:absolute;left:17px;top:21px;width:12px;height:12px;border-radius:50%;background:var(--acc)}
.story{display:grid;gap:18px}
.cita{font:italic 400 26px/1.3 Newsreader,Georgia,serif;border-left:3px solid var(--acc);padding:4px 0 4px 18px;margin:24px 0}
.cita small{display:block;font:13px Inter,sans-serif;color:var(--mute);margin-top:8px;font-style:normal}
.caps{counter-reset:c;display:grid;gap:12px;margin-top:20px}
.cap{display:flex;gap:16px;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:16px}
.cap .n{flex:none;width:44px;height:44px;border-radius:12px;background:var(--deep);color:#fff;display:grid;place-items:center;font:500 22px Newsreader,serif}
.cap b{display:block;line-height:1.3}.cap span{display:block;color:var(--mute);font-size:15px;margin-top:4px}
.press{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:22px}
.press .m{font:600 20px Newsreader,serif}
.test{background:var(--deep);color:#fff;border-radius:22px;padding:28px 22px;text-align:center}
.test p{color:#ffffffd0}
.steps{display:grid;gap:12px;margin:20px 0 26px}
.steps div{display:flex;gap:14px;align-items:flex-start}
.steps i{flex:none;font-style:normal;width:30px;height:30px;border-radius:50%;background:var(--soft);color:var(--g1);display:grid;place-items:center;font-weight:700;font-size:14px;margin-top:1px}
form{background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:22px 18px}
label.f{display:block;font-size:14px;font-weight:600;margin:18px 0 6px}
label.f:first-child{margin-top:0}
.hint{font-size:13px;color:var(--mute);margin:-2px 0 6px}
input[type=text],input[type=tel],textarea,select{width:100%;border-radius:12px;border:1.5px solid var(--line);background:#fff;color:var(--ink);font:16px/1.5 Inter,sans-serif;padding:12px 14px}
input:focus,textarea:focus,select:focus{outline:2px solid var(--acc);outline-offset:1px}
textarea{min-height:84px;resize:vertical}
.opts{display:grid;gap:8px}
.opt{display:flex;gap:12px;align-items:flex-start;border:1.5px solid var(--line);border-radius:14px;padding:12px 14px;cursor:pointer;background:#fff}
.opt:has(input:checked){border-color:var(--deep);background:color-mix(in srgb,var(--soft) 30%,#fff)}
.opt input{margin-top:4px;accent-color:var(--deep);flex:none}
.opt b{display:block;line-height:1.3}.opt span{display:block;font-size:14px;color:var(--mute)}
.check{display:flex;gap:10px;align-items:flex-start;font-size:13px;color:var(--mute);margin:20px 0 16px}
.check input{margin-top:3px;accent-color:var(--deep);flex:none}
.err{color:#b42318;font-size:14px;min-height:20px;margin-bottom:8px}
.row2{display:grid;grid-template-columns:1fr 1.4fr;gap:10px}
.done{background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:24px 20px;display:grid;gap:12px}
.done .id{font:600 14px Inter;color:var(--acc)}
.faq details{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin-top:10px}
.faq summary{font-weight:600;cursor:pointer}
.faq details p{margin:10px 0 0;color:var(--mute)}
.shop{display:flex;gap:16px;align-items:flex-start;background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:18px}
.shop img{width:90px;border-radius:5px;box-shadow:0 10px 20px rgba(0,0,0,.2);flex:none}
footer{padding:34px 0 50px;font-size:13px;color:var(--mute);text-align:center}
footer a{color:inherit}
.hide{display:none!important}
</style>
</head>
<body>
<nav><div class="wrap"><b id="navt"></b><a href="#pedido" data-ev="clic_nav_pedido">Pedir dedicado</a></div></nav>
<div id="root"></div>
<script src="contenido.js"></script>
<script>
const A=window.APP||{},C=A.config||{},B=A.libro||{},L=A.landing||{},T=A.tema||{};
const $=id=>document.getElementById(id);
const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const wa=t=>`https://wa.me/${C.wa}?text=${encodeURIComponent(t)}`;
{const r=document.documentElement.style,m={"--g1":T.cielo1,"--g2":T.cielo2,"--deep":T.fuerte,"--acc":T.acento,"--soft":T.suave,"--ink":T.texto,"--bg":T.fondo};for(const k in m)if(m[k])r.setProperty(k,m[k]);if(T.texto){r.setProperty("--mute",T.texto+"b8")}if(T.suave)r.setProperty("--line",T.suave+"99")}
let qs;try{qs=new URLSearchParams(location.search)}catch(e){qs=new URLSearchParams("")}
const SRC=qs.get("utm_source")||(document.referrer.includes(location.host)?"app":"directo");
let SID="";try{SID=sessionStorage.getItem("qtm-sid")||""}catch(e){}
if(!SID){SID=Math.random().toString(36).slice(2,10);try{sessionStorage.setItem("qtm-sid",SID)}catch(e){}}
function track(ev,extra){
 if(!C.endpoint)return;
 const body=JSON.stringify(Object.assign({ev,sid:SID,src:SRC,app:C.app||B.titulo},extra||{}));
 try{if(navigator.sendBeacon&&navigator.sendBeacon(C.endpoint,new Blob([body],{type:"text/plain;charset=utf-8"})))return}catch(e){}
 try{fetch(C.endpoint,{method:"POST",mode:"no-cors",headers:{"Content-Type":"text/plain;charset=utf-8"},body})}catch(e){}
}
const P=L.precios||{},CB=L.combo||null,PR=A.prensa||null;
$("navt").textContent=B.titulo||"";
const productos=[{k:"uno",t:`${B.titulo}`,d:"Ejemplar dedicado y firmado por "+(B.autorCorto||B.autor),p:P.uno}];
if(CB)productos.push({k:"combo",t:CB.titulo,d:CB.texto,p:P.combo});
const priceTxt=p=>p&&p.precio?` · ${p.precio}`:"";

$("root").innerHTML=`
<header class="hero"><div class="wrap">
 ${B.portada?`<img src="${esc(B.portada)}" alt="Portada de ${esc(B.titulo)}">`:""}
 <div class="by">${esc(B.autor)}</div>
 <h1>${esc(L.titular||B.titulo)}</h1>
 <p class="lead">${esc(L.bajada||B.gancho)}</p>
 <div class="ctas">
  <a class="btn gold" href="#pedido" data-ev="clic_hero_pedido">Quiero mi ejemplar dedicado</a>
  <a class="btn ghost small" href="./?utm_source=landing" data-ev="clic_hero_test">${esc(L.testBoton||"Haz el test del libro")}</a>
 </div>
 ${P.uno&&P.uno.precio?`<div class="price">${esc(P.uno.precio)}${L.envio?` · Envío: ${esc(L.envio)}`:""}</div>`:""}
</div></header>

${L.paraQuien?`<section><div class="wrap">
 <div class="kicker">Para quién es</div><h2>${esc(L.paraQuienTitulo||"Este libro es para ti si…")}</h2>
 <ul class="list">${L.paraQuien.map(x=>`<li>${esc(x)}</li>`).join("")}</ul>
</div></section>`:""}

${L.historia?`<section><div class="wrap story">
 <div><div class="kicker">La historia</div><h2>${esc(L.historia.titulo)}</h2>
 ${L.historia.parrafos.map(p=>`<p>${esc(p)}</p>`).join("")}</div>
 ${L.cita?`<div class="cita">“${esc(L.cita.t)}”<small>${esc(L.cita.r||B.autor)}</small></div>`:""}
</div></section>`:""}

${L.capitulos?`<section><div class="wrap">
 <div class="kicker">Lo que vas a encontrar</div><h2>${esc(L.capitulosTitulo||"Dentro del libro")}</h2>
 ${L.capitulosIntro?`<p class="mute">${esc(L.capitulosIntro)}</p>`:""}
 <div class="caps">${L.capitulos.map(([n,t,d])=>`<div class="cap"><div class="n">${esc(n)}</div><div><b>${esc(t)}</b>${d?`<span>${esc(d)}</span>`:""}</div></div>`).join("")}</div>
</div></section>`:""}

${PR?`<section><div class="wrap"><div class="press">
 <div class="kicker">En los medios</div><div class="m">${esc(PR.medio)}</div><h3>${esc(PR.titular)}</h3>
 ${PR.cita?`<p class="mute"><em>“${esc(PR.cita)}”</em></p>`:""}
 ${PR.enlace?`<a class="btn small ghost" style="color:var(--ink)" data-ev="clic_prensa" href="${esc(PR.enlace)}" target="_blank" rel="noopener">${esc(PR.boton||"Leer la nota")}</a>`:""}
</div></div></section>`:""}

<section><div class="wrap"><div class="test">
 <div class="kicker" style="color:var(--soft)">Antes de leerlo, vívelo</div>
 <h2>${esc(L.testTitulo||"Haz el test del libro")}</h2>
 <p>${esc(L.testTexto||"Tres minutos para descubrir qué capítulo es para ti hoy.")}</p>
 <a class="btn gold" href="./?utm_source=landing" data-ev="clic_test">Hacer el test</a>
</div></div></section>

<section id="pedido"><div class="wrap">
 <div class="kicker">Ejemplar dedicado</div><h2>${esc(L.pedidoTitulo||"Pide tu libro firmado y dedicado")}</h2>
 <p class="mute">${esc(L.pedidoTexto||"Lo dedicamos a mano para ti o para la persona que elijas y te lo enviamos.")}</p>
 <div class="steps">
  <div><i>1</i><span>Llena tus datos y a quién va dedicado.</span></div>
  <div><i>2</i><span>Se abre WhatsApp con tu pedido listo: solo presiona enviar.</span></div>
  <div><i>3</i><span>${esc(L.pasoPago||"Te confirmamos el total y la forma de pago. Lo dedicamos y te lo enviamos.")}</span></div>
 </div>
 <form id="pf" novalidate>
  <label class="f">¿Qué quieres pedir?</label>
  <div class="opts">${productos.map((p,i)=>`<label class="opt"><input type="radio" name="prod" value="${p.k}" ${i?"":"checked"}><div><b>${esc(p.t)}${esc(priceTxt(p.p))}</b><span>${esc(p.d)}</span></div></label>`).join("")}</div>
  <label class="f" for="pq">Cantidad</label>
  <select id="pq">${[1,2,3,4,5].map(n=>`<option>${n}</option>`).join("")}</select>
  <label class="f" for="pd">¿Para quién es la dedicatoria?</label>
  <div class="hint">Puedes ser tú o alguien a quien se lo vas a regalar.</div>
  <input type="text" id="pd" maxlength="80" placeholder="Ej. Para Laura">
  <label class="f" for="pm">Mensaje especial (opcional)</label>
  <textarea id="pm" maxlength="240" placeholder="Algo que quieras que ${esc(B.autorCorto||"el autor")} tome en cuenta al dedicarlo"></textarea>
  <label class="f">Entrega</label>
  <div class="opts">
   <label class="opt"><input type="radio" name="ent" value="envio" checked><div><b>Envío a domicilio</b><span>${esc(L.envio?"Costo de envío: "+L.envio:"Por paquetería a todo México, llega en 1 a 3 días.")}</span></div></label>
   ${L.entregaLocal?`<label class="opt"><input type="radio" name="ent" value="local"><div><b>Entrega en mano</b><span>${esc(L.entregaLocal)}</span></div></label>`:""}
  </div>
  <div id="dir">
   <label class="f" for="pa">Calle, número y colonia</label><input type="text" id="pa" maxlength="140" autocomplete="street-address">
   <div class="row2"><div><label class="f" for="pcp">Código postal</label><input type="text" id="pcp" inputmode="numeric" maxlength="5" autocomplete="postal-code"></div>
   <div><label class="f" for="pc">Ciudad y estado</label><input type="text" id="pc" maxlength="80"></div></div>
  </div>
  <label class="f" for="pn">Tu nombre completo</label><input type="text" id="pn" maxlength="80" autocomplete="name">
  <label class="f" for="pw">Tu WhatsApp (10 dígitos)</label><input type="tel" id="pw" maxlength="20" inputmode="tel" autocomplete="tel" placeholder="Ej. 33 1234 5678">
  <label class="check"><input type="checkbox" id="pok"><span>Acepto que ${esc(B.autor)} use estos datos solo para entregarme mi pedido y avisarme de novedades del libro. Puedo pedir que me den de baja en cualquier momento.</span></label>
  <div class="err" id="perr" role="alert"></div>
  <button class="btn" type="submit">Enviar mi pedido por WhatsApp</button>
 </form>
 <div class="done hide" id="pdone"></div>
</div></section>

${L.faq?`<section class="faq"><div class="wrap">
 <div class="kicker">Preguntas frecuentes</div><h2>Antes de pedirlo</h2>
 ${L.faq.map(([q,a])=>`<details><summary>${esc(q)}</summary><p>${esc(a)}</p></details>`).join("")}
</div></section>`:""}

${CB&&CB.enlace?`<section><div class="wrap">
 <div class="kicker">Del mismo equipo</div>
 <div class="shop">${CB.img?`<img src="${esc(CB.img)}" alt="">`:""}<div><h3>${esc(CB.otroTitulo)}</h3><p class="mute">${esc(CB.otroTexto)}</p><a class="btn small" data-ev="clic_landing_otro" href="${esc(CB.enlace)}" target="_blank" rel="noopener">${esc(CB.boton||"Conócelo")}</a></div></div>
</div></section>`:""}

<footer><div class="wrap">
 ${C.editorial?`<p>¿Prefieres comprarlo sin dedicatoria? <a data-ev="clic_editorial" href="${esc(C.editorial)}" target="_blank" rel="noopener">Cómpralo en ${esc(B.editorial||"la editorial")}</a>${C.ml?` · <a data-ev="clic_mercadolibre" href="${esc(C.ml)}" target="_blank" rel="noopener">Mercado Libre</a>`:""}${C.amz?` · <a data-ev="clic_amazon" href="${esc(C.amz)}" target="_blank" rel="noopener">Amazon</a>`:""}</p>`:""}
 ${L.redes?`<p>${L.redes.map(([t,u])=>`<a data-ev="clic_redes" href="${esc(u)}" target="_blank" rel="noopener">${esc(t)}</a>`).join(" · ")}</p>`:""}
 <p>${esc(B.titulo)} · ${esc(B.autor)} · ${esc(B.editorial||"")}</p>
 ${A.credito?`<p>${esc(A.credito.texto)}</p>`:""}
</div></footer>`;

document.addEventListener("click",e=>{const a=e.target.closest("[data-ev]");if(a)track(a.dataset.ev)});
const dir=$("dir");
document.querySelectorAll('input[name=ent]').forEach(r=>r.onchange=()=>dir.classList.toggle("hide",r.value==="local"&&r.checked));
track("visita_landing");

$("pf").onsubmit=e=>{
 e.preventDefault();
 const v=id=>$(id).value.trim();
 const prod=document.querySelector('input[name=prod]:checked').value,ent=document.querySelector('input[name=ent]:checked').value;
 const n=v("pn"),w=$("pw").value.replace(/\D/g,""),ded=v("pd"),msg=v("pm"),q=$("pq").value;
 const adr=ent==="envio"?[v("pa"),v("pcp")&&"CP "+v("pcp"),v("pc")].filter(Boolean).join(", "):"";
 const er=$("perr");
 if(!C.wa&&!C.endpoint){er.textContent="Los pedidos en línea abren muy pronto.";return}
 if(!ded){er.textContent="Escribe para quién es la dedicatoria.";return}
 if(ent==="envio"&&(!v("pa")||v("pcp").length<5||!v("pc"))){er.textContent="Completa tu dirección, código postal y ciudad.";return}
 if(!n){er.textContent="Escribe tu nombre.";return}
 if(w.length<10){er.textContent="Revisa tu WhatsApp: deben ser 10 dígitos.";return}
 if(!$("pok").checked){er.textContent="Necesitamos tu autorización para usar tus datos en el pedido.";return}
 er.textContent="";
 const id=(L.prefijo||"PED")+"-"+Math.floor(1000+Math.random()*9000);
 const pr=productos.find(p=>p.k===prod);
 const texto=[`Hola ${B.autorCorto||""}, quiero un ejemplar dedicado.`,``,`*Pedido ${id}*`,`Libro: ${pr.t} (x${q})`,`Dedicatoria para: ${ded}`,msg?`Mensaje: ${msg}`:"",`Entrega: ${ent==="envio"?"Envío a domicilio":"Entrega en mano"}`,adr?`Dirección: ${adr}`:"",``,`Mi nombre: ${n}`,`Mi WhatsApp: ${w}`].filter((x,i,a)=>x!==""||a[i-1]!=="").join("\n");
 track("pedido",{pedido:id,nombre:n,wa:w,producto:pr.t,cantidad:q,dedicatoria:ded,mensaje:msg,entrega:ent==="envio"?"Envío":"En mano",direccion:adr,ok:true});
 if(C.wa)window.open(wa(texto),"_blank");
 const pago=pr.p&&pr.p.pago;
 $("pf").classList.add("hide");
 const d=$("pdone");d.classList.remove("hide");
 d.innerHTML=`<div class="id">Pedido ${esc(id)}</div><h3>¡Gracias, ${esc(n.split(" ")[0])}!</h3>
  <p class="mute">${C.wa?"Se abrió WhatsApp con tu pedido. Si no se abrió o no lo enviaste, usa el botón de abajo: ahí te confirmamos todo.":"Recibimos tu pedido. Te escribiremos por WhatsApp para confirmarlo."}</p>
  ${C.wa?`<a class="btn" data-ev="clic_reenviar_pedido" href="${esc(wa(texto))}" target="_blank" rel="noopener">Enviar mi pedido por WhatsApp</a>`:""}
  ${pago?`<a class="btn gold" data-ev="clic_pagar" href="${esc(pago)}" target="_blank" rel="noopener">Pagar ahora con tarjeta o transferencia</a><p class="mute" style="font-size:14px;margin:0">${esc(L.notaPago||"Si pagas ahora, manda tu comprobante por el mismo WhatsApp.")}</p>`:""}
  ${C.comunidad?`<a class="btn ghost small" style="color:var(--ink)" data-ev="clic_comunidad" href="${esc(C.comunidad)}" target="_blank" rel="noopener">Únete a la comunidad en WhatsApp</a>`:""}`;
 d.scrollIntoView({behavior:"smooth",block:"start"});
};
</script>
</body>
</html>
